; PlatformIO Integration Test Configuration
; Run with: pio test -e integration

[env:integration]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
monitor_speed = 115200
lib_deps = 
    esphome/ESPAsyncWebServer-esphome@^3.3.0
    bblanchon/ArduinoJson@^7.3.1
    knolleary/PubSubClient@^2.8
    fmalpartida/LiquidCrystal@^1.5.0
    adafruit/Adafruit NeoPixel@^1.12.5
    throwtheswitch/Unity@^2.5.2
build_flags = 
    -DUNIT_TEST
    -DARDUINO_USB_CDC_ON_BOOT=1
test_framework = custom
test_command = pio run -e integration -t upload && pio device monitor -e integration
test_build_project_src = false
src_dir = test/integration