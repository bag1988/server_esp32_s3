; PlatformIO Unit Test Configuration
; Run with: pio test -e test

[env:test]
platform = native
framework = 
board = 
build_flags = 
    -std=gnu++17
    -Iinclude
    -Ilib/VariablesInfo
    -Ilib/DeviceManager
    -Ilib/NvsStorage
    -Ilib/SpiffsSetting
    -Ilib/TaskMonitor
    -Ilib/XiaomiScanner
    -Ilib/LcdSetting
    -Ilib/WebServerSettings
    -Ilib/OtaSetting
    -Itest/mocks
    -DUNIT_TEST
    -DARDUINO=10819
    -DESP32
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_ARCH_ESP32
test_framework = custom
test_command = ./test_runner
test_build_project_src = false
src_dir = test